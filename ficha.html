<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ficha do Colaborador — SST</title>
<style>
  :root{ --navy:#1A2540; --ink:#1f2937; --soft:#5b6b7f; --line:#e2e8f0; --bg:#eef2f6;
         --ok:#2E8B57; --okbg:#e6f4ea; --warn:#b7800b; --warnbg:#fff4d6; --bad:#C0392B; --badbg:#fde8e6; --grey:#6b7280; --greybg:#eef0f3; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  .top{ background:var(--navy); color:#fff; padding:14px 18px; font-weight:700; letter-spacing:.02em; font-size:14px; }
  .top small{ display:block; font-weight:400; opacity:.8; font-size:12px; margin-top:2px; }
  .wrap{ max-width:560px; margin:0 auto; padding:14px; }
  .card{ background:#fff; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:16px; margin-bottom:12px; }
  .field{ margin-bottom:10px; }
  .field:last-child{ margin-bottom:0; }
  .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--soft); font-weight:700; }
  .val{ font-size:17px; font-weight:600; margin-top:2px; border-bottom:1px dashed var(--line); padding-bottom:6px; }
  .nome{ font-size:21px; font-weight:800; }
  .big{ border-radius:14px; padding:18px 14px; text-align:center; margin-bottom:12px; }
  .big .t{ font-size:26px; font-weight:900; letter-spacing:.02em; }
  .big .s{ font-size:13px; margin-top:4px; }
  .ok{ background:var(--okbg); color:var(--ok); } .warn{ background:var(--warnbg); color:var(--warn); }
  .bad{ background:var(--badbg); color:var(--bad); } .grey{ background:var(--greybg); color:var(--grey); }
  h2{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--soft); margin:0 0 10px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-of-type{ border-top:0; }
  .row .it{ font-weight:700; font-size:15px; }
  .row .dt{ font-size:12px; color:var(--soft); margin-top:2px; }
  .chip{ font-size:12px; font-weight:800; padding:5px 9px; border-radius:999px; white-space:nowrap; }
  .foot{ font-size:12px; color:var(--soft); text-align:center; line-height:1.5; padding:6px 10px 24px; }
  .alerta{ background:var(--warnbg); color:#6b4e00; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .erro{ text-align:center; padding:40px 16px; color:var(--soft); }
</style>
</head>
<body>
<div class="top">EMERGENT COLD · FICHA DO COLABORADOR <small id="tipo">Segurança e Saúde do Trabalho</small></div>
<div class="wrap" id="app"><div class="erro">Carregando…</div></div>
<script>
(function(){
  'use strict';
  var ST = { V:['VÁLIDO','ok'], A:['A VENCER','warn'], X:['VENCIDO','bad'], N:['NÃO INFORMADO','grey'], S:['SUBSTITUÍDO','grey'],
             R:['REALIZADO','grey'], D:['DESLIGADO','grey'], Z:['NÃO SE APLICA','grey'] };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function dt(s){ return s && s.length === 8 ? s.slice(6,8) + '/' + s.slice(4,6) + '/' + s.slice(0,4) : ''; }
  window.addEventListener('hashchange', function(){ location.reload(); });
  function chip(code){ var s = ST[code] || ['NÃO REALIZADO','grey']; return '<span class="chip ' + s[1] + '">' + s[0] + '</span>'; }
  function decode(h){
    var b = h.replace(/-/g,'+').replace(/_/g,'/'); while (b.length % 4) b += '=';
    return JSON.parse(decodeURIComponent(escape(atob(b))));
  }
  var app = document.getElementById('app'), d;
  try { d = decode(location.hash.slice(1)); } catch (e) { d = null; }
  if (!d || !d.n) { app.innerHTML = '<div class="erro"><b>QR Code inválido ou incompleto.</b><br>Escaneie novamente o crachá do colaborador.</div>'; return; }
  var aso = d.t === 'a';
  document.getElementById('tipo').textContent = aso ? 'ASO — Atestado de Saúde Ocupacional' : 'NRs e Treinamentos';
  var geralMap = { 'APTO':['APTO','ok','Pode exercer a função'], 'APTO COM RESTRIÇÕES':['APTO COM RESTRIÇÕES','warn','Confira as restrições no ASO'],
                   'NÃO APTO':['NÃO APTO','bad','Procure o SESMT antes de liberar'], 'DESLIGADO':['DESLIGADO','grey','Colaborador desligado'] };
  var big;
  if (aso) { var g = geralMap[d.g] || [d.g || '—', 'grey', '']; big = { t:g[0], c:g[1], s:g[2] }; }
  else {
    var n = { V:0, A:0, X:0 }; (d.i || []).forEach(function(r){ if (r[1] in n) n[r[1]]++; });
    big = n.X ? { t:'PENDENTE', c:'bad', s:n.X + ' NR vencida(s)' } : n.A ? { t:'ATENÇÃO', c:'warn', s:n.A + ' NR vence(m) em breve' }
        : n.V ? { t:'EM DIA', c:'ok', s:n.V + ' NR válida(s)' } : { t:'SEM REGISTRO', c:'grey', s:'Nenhuma NR lançada' };
  }
  var hoje = new Date(), em = d.e ? new Date(+d.e.slice(0,4), +d.e.slice(4,6) - 1, +d.e.slice(6,8)) : null;
  var dias = em ? Math.floor((hoje - em) / 86400000) : 0;
  var html = '';
  if (dias > 30) html += '<div class="alerta">⚠ Este crachá foi emitido há ' + dias + ' dias. A situação pode ter mudado — confirme com o SESMT.</div>';
  html += '<div class="card"><div class="field"><div class="lbl">Colaborador</div><div class="val nome">' + esc(d.n) + '</div></div>' +
          '<div class="field"><div class="lbl">Função</div><div class="val">' + esc(d.f || '—') + '</div></div>' +
          '<div class="field"><div class="lbl">Unidade</div><div class="val">' + esc(d.u || '—') + '</div></div></div>';
  html += '<div class="big ' + big.c + '"><div class="t">' + esc(big.t) + '</div><div class="s">' + esc(big.s) + '</div></div>';
  if (aso) {
    html += '<div class="card"><h2>Situação do ASO</h2>' +
      '<div class="field"><div class="lbl">Último ASO</div><div class="val">' + (d.x ? esc(d.x) + (d.xd ? ' — ' + dt(d.xd) : '') : 'Nenhum registrado') + '</div></div>' +
      '<div class="field"><div class="lbl">Próximo vencimento</div><div class="val">' + (dt(d.pv) || '—') + ' ' + chip(d.sa) + '</div></div>' +
      '<div class="field"><div class="lbl">Conclusão do médico</div><div class="val">' + esc(d.c || 'Não informada') + '</div></div></div>';
  }
  html += '<div class="card"><h2>' + (aso ? 'Exames' : 'NRs e treinamentos') + '</h2>';
  (d.i || []).forEach(function(r){
    var extra = 'Sem data lançada';
    if (r[1] === 'V' || r[1] === 'A') extra = 'Válido até ' + dt(r[2]);
    else if (r[1] === 'X') extra = 'Venceu em ' + dt(r[2]);
    else if (r[1] === 'S') extra = 'Realizado em ' + dt(r[3]) + ' — já substituído por exame mais recente';
    else if (r[1] === 'R') extra = 'Realizado em ' + dt(r[3]);
    else if (r[1] === 'Z') extra = 'Não exigido para esta função';
    html += '<div class="row"><div><div class="it">' + esc(r[0]) + '</div><div class="dt">' + extra + '</div></div>' + chip(r[1]) + '</div>';
  });
  html += '</div>';
  html += '<div class="foot">Informações da data de emissão do crachá: <b>' + (dt(d.e) || '—') + '</b>.<br>Documento de consulta — em caso de dúvida, procure o SESMT da unidade.</div>';
  app.innerHTML = html;
  document.title = 'Ficha — ' + d.n;
})();
</script>
</body>
</html>
